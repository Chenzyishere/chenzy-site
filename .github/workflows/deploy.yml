name: Deploy

on:
  push:
    branches: ['main']
  repository_dispatch:
    types: [content-updated]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout notes from documents repo
        if: github.event_name == 'repository_dispatch'
        uses: actions/checkout@v4
        with:
          repository: Chenzyishere/chenzymark-documents
          ref: main
          path: _content_repo
          token: ${{ secrets.DOCS_REPO_PAT }}

      - name: Sync Markdown notes
        if: github.event_name == 'repository_dispatch'
        run: |
          mkdir -p src/content/notes
          rsync -av --delete --exclude='leetCode copy.md' --exclude='codex_log.md' \
            _content_repo/source/_posts/ src/content/notes/

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
